<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vouchers · Paddle Rage</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#202c24;background:#f4f5ef;--muted:#768075;--line:#e1e5db;--accent:#d4ef9d}*{box-sizing:border-box}body{margin:0}main{max-width:940px;margin:auto;padding:30px 24px 70px}a{color:#65715f;text-decoration:none;font-size:13px}header{display:flex;align-items:center;justify-content:space-between;gap:15px}header>span,.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:700;color:#768075}h1{font-size:44px;letter-spacing:-.055em;font-weight:600;margin:36px 0 30px}h2{font-size:20px;font-weight:600;letter-spacing:-.03em;margin:0}p{font-size:13px;color:var(--muted);line-height:1.5}section,article{background:white;border:1px solid var(--line);border-radius:20px;padding:28px;margin-bottom:24px}.create-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.ticket-mark{background:#edf5dc;padding:9px 12px;border:1px dashed #a5b77f;border-radius:8px;font-size:12px;font-weight:650;color:#576837}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.wide{grid-column:1/-1}label,.field-label,legend{display:block;font-size:12px;font-weight:600;color:#667061}input,select,button,textarea{font:inherit}input:not([type=checkbox]):not([type=hidden]),select,textarea{width:100%;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fafbf7;color:#263222;padding:12px;margin-top:8px;font-size:14px;outline:none}input::placeholder{color:#a0a697}input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:#8aa263;box-shadow:0 0 0 3px #d4ef9d55}button{border:0;border-radius:10px;min-height:44px;padding:11px 18px;background:#263a28;color:#fff;font-size:13px;font-weight:600;cursor:pointer}button:hover{background:#39513b}button:disabled{opacity:.45;cursor:wait}button.secondary{background:#eff2e9;color:#526247}button.secondary:hover{background:#e3ead8}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #79964d;outline-offset:3px}.offer-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.offer-row button{background:#f2f4ed;border:1px solid transparent;color:#59634f;min-width:62px}.offer-row button[aria-pressed=true]{background:var(--accent);border-color:#b4cf7e;color:#293b19}.custom-offer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.date-row{display:flex;gap:8px;margin-top:8px}.date-button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;background:#fafbf7;border:1px solid var(--line);color:#35452c;font-size:14px;font-weight:500}.date-button:hover{background:#eff3e7}.date-button:after{content:'▦';color:#7f906f;font-size:20px;line-height:1}.date-row select{margin:0;width:104px;flex-shrink:0}.advanced{border-top:1px solid var(--line);margin:24px 0 0}.advanced>summary{padding:20px 0;cursor:pointer;font-size:13px;color:#65715b;list-style:none;display:flex;justify-content:space-between}.advanced>summary:after{content:'+';font-size:19px;line-height:1}.advanced[open]>summary:after{content:'−'}.advanced[open]{padding-bottom:20px}fieldset{border:0;padding:0;margin:20px 0}.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;min-height:40px;padding:9px 12px;cursor:pointer;font-size:12px}.checks label:has(input:checked){background:#eff6e3;border-color:#b9ce94;color:#384b27}input[type=checkbox]{appearance:none;width:16px;height:16px;flex-shrink:0;margin:0;border:1px solid #a9b39e;border-radius:4px;display:grid;place-items:center;background:#fff;cursor:pointer}input[type=checkbox]:checked{background:#567638;border-color:#567638}input[type=checkbox]:checked:after{content:'';width:7px;height:4px;border:solid white;border-width:0 0 2px 2px;transform:rotate(-45deg) translateY(-1px)}.fee-note{display:flex;align-items:flex-start;gap:10px;font-size:12px;font-weight:400;color:#66745c;line-height:1.5;padding:16px 0;border-top:1px solid var(--line)}.fee-note input{margin-top:2px}.form-foot{display:flex;justify-content:flex-end;margin-top:8px}.form-foot button{min-width:180px;background:#d4ef9d;color:#2a3b1a}.form-foot button:hover{background:#c4e481}.muted{font-size:12px;color:var(--muted)}#notice{padding:12px 16px;background:#edf4df;border-radius:10px;margin-bottom:20px;font-size:13px}#notice:empty{display:none}.list-head{margin:36px 0 18px}.empty{padding:35px;text-align:center;border:1px dashed #d4dbca;border-radius:16px;color:#89947e;font-size:13px}.actions{display:flex;gap:8px;margin-top:16px}article summary{cursor:pointer;font-size:13px;padding:12px 0;color:#687760}article p{margin:10px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}textarea{min-height:90px}.campaign-top{display:flex;justify-content:space-between;gap:20px;align-items:center}.discount-badge{font-size:28px;font-weight:600;letter-spacing:-.04em;color:#638438}.state-pill{font-size:11px;padding:5px 9px;background:#f0f4e9;border-radius:20px;color:#728459}.owner-settings{margin-top:32px}.owner-settings>summary{cursor:pointer;color:#79846c;font-size:12px;padding:12px 0}#authorityForm{margin-top:18px}#authorityForm>button{margin-top:14px}dialog{border:1px solid #e1e5db;border-radius:20px;padding:22px;width:340px;max-width:calc(100vw - 28px);box-shadow:0 28px 90px #17221530;color:#263222;background:white}dialog::backdrop{background:#14231955;backdrop-filter:blur(3px)}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.cal-head button{background:#f1f4eb;color:#566547;min-height:38px;padding:6px 12px}.cal-head strong{font-size:14px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal-grid>span{text-align:center;padding:9px 0;font-size:10px;color:#8b9581}.cal-grid button{min-height:37px;padding:7px 0;background:transparent;color:#47573a;font-size:13px}.cal-grid button:hover{background:#ecf4df}.cal-grid button[aria-pressed=true]{background:var(--accent);color:#23321a}.cal-foot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.cal-foot button{font-size:12px;min-height:38px}[hidden]{display:none!important}@media(max-width:600px){main{padding:22px 16px 50px}header>span{font-size:9px}h1{font-size:36px;margin:28px 0 24px}section,article{padding:22px 18px}.grid{grid-template-columns:1fr}.offer-row{gap:6px}.offer-row button{min-width:0;padding:11px 9px;font-size:12px;flex:1}.form-foot button{width:100%}.date-row select{width:100px}.campaign-top{gap:12px}}
</style></head><body><main>
<header><a href="admin.html">← Dashboard</a><span>PADDLE RAGE</span></header><h1>Vouchers</h1>
<div id="notice" role="status" aria-live="polite">Loading…</div><div id="workspace" hidden>
<section><div class="create-head"><h2>New voucher</h2><span class="ticket-mark">PLAYER PERKS</span></div>
<form id="campaignForm">
<div class="grid"><label class="wide">Name<input name="name" required maxlength="100" placeholder="e.g. Weekday treat"></label>
<div class="wide"><span class="field-label">Discount</span><div class="offer-row" id="offerPresets"><button type="button" data-offer="10" aria-pressed="false">10%</button><button type="button" data-offer="20" aria-pressed="true">20%</button><button type="button" data-offer="50" aria-pressed="false">50%</button><button type="button" data-offer="100" aria-pressed="false">100%</button><button type="button" data-offer="custom" aria-pressed="false">Custom</button></div><div id="customOffer" class="custom-offer" hidden><select name="kind" aria-label="Discount type"><option value="percent">Percent %</option><option value="fixed">Pesos ₱</option></select><input name="value" aria-label="Discount amount" type="number" min="0.01" step="0.01" required value="20"></div></div>
<div class="wide"><span class="field-label">Valid until · PH time</span><div class="date-row"><input name="endsAt" type="hidden"><button type="button" class="date-button" data-date="endsAt">Choose date</button><select name="endHour" aria-label="Expiry hour"></select></div></div></div>
<details class="advanced"><summary>Courts &amp; options</summary><div class="grid">
<div class="wide"><span class="field-label">Starts · PH time</span><div class="date-row"><input name="startsAt" type="hidden"><button type="button" class="date-button" data-date="startsAt">Today</button><select name="startHour" aria-label="Start hour"></select></div></div>
<label>Code type<select name="mode"><option value="reusable">Reusable</option><option value="single">Single-use codes</option></select></label><label id="customCodeField">Code · optional<input name="code" pattern="[A-Za-z0-9-]{6,40}" maxlength="40" placeholder="Auto-generated"></label><label id="batchSizeField" hidden>Number of codes<input name="batchSize" type="number" min="1" max="500" value="1"></label>
<label>Use limit<input name="maxUses" type="number" min="1" max="100000" value="50" required></label><label>Per player · optional<input name="customerLimit" type="number" min="1"></label><label>Minimum spend · ₱<input name="minSpend" type="number" min="0" step="0.01" value="0"></label><label>Discount cap · ₱<input name="maxDiscount" type="number" min="0.01" step="0.01"></label>
</div><fieldset><legend>Courts</legend><div class="checks" id="courtOptions"></div></fieldset><fieldset><legend>Bookings</legend><div class="checks"><label><input type="checkbox" name="bookingTypes" value="guest" checked>Guest</label><label><input type="checkbox" name="bookingTypes" value="host" checked>Host</label></div></fieldset>
<div class="grid"><div><span class="field-label">Play from · optional</span><input name="playFrom" type="hidden"><button type="button" class="date-button" data-date="playFrom" style="margin-top:8px">Any date</button></div><div><span class="field-label">Play until · optional</span><input name="playTo" type="hidden"><button type="button" class="date-button" data-date="playTo" style="margin-top:8px">Any date</button></div><label>From<select name="hourFrom"></select></label><label>Until<select name="hourTo"></select></label></div>
<fieldset><legend>Days</legend><div class="checks" id="weekdays"></div></fieldset></details>
<label class="fee-note"><input type="checkbox" name="acceptOwnerFees" required><span>I cover the discount + original booking fee, even at 100% off.</span></label><div class="form-foot"><button type="submit">Create voucher ↗</button></div></form></section>
<header class="list-head"><h2>Your vouchers</h2><button id="refresh" class="secondary" type="button">Refresh</button></header><div id="campaigns"></div>
<details id="authority" class="owner-settings" hidden><summary>Court-owner permissions</summary><form id="authorityForm"><label>Court owner<select id="authorityOwner" required></select></label><div id="authorityCourts" class="checks"></div><button type="submit">Save permissions</button></form></details>
</div></main>
<dialog id="dateDialog" aria-label="Choose date"><div class="cal-head"><button type="button" id="monthPrev" aria-label="Previous month">‹</button><strong id="calendarMonth" aria-live="polite"></strong><button type="button" id="monthNext" aria-label="Next month">›</button></div><div class="cal-grid" id="calendarDays"></div><div class="cal-foot"><button type="button" id="clearDate" class="secondary">Clear</button><button type="button" id="closeDate" class="secondary">Close</button></div></dialog>
<script src="supabase.min.js"></script><script src="supabase-config.js"></script><script src="vouchers.js"></script></body></html>
