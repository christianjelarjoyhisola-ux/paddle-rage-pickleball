<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#111827">
  <title>Paddle Rage Live Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player-live.css?v=20260725-live-cyan-v2">
</head>
<body>
  <a class="plb-skip" href="#playerLiveMain">Skip to live board</a>
  <header class="plb-header">
    <div class="plb-header-inner">
      <a class="plb-brand" href="index.html" aria-label="Paddle Rage home">
        <img class="plb-brand-mark" src="paddleragelogo-transparent.png" alt="" width="48" height="48" aria-hidden="true">
        <span class="plb-brand-copy">
          <span>Paddle Rage</span>
          <strong>Player Live Board</strong>
        </span>
      </a>
      <div class="plb-header-stats" id="plbHeaderStats" aria-label="Session totals">
        <div><strong>–</strong><span>Courts</span></div>
        <div><strong>–</strong><span>Players</span></div>
        <div><strong>–</strong><span>Waiting</span></div>
        <div><strong>–</strong><span>Results</span></div>
      </div>
      <div class="plb-header-state">
        <span class="plb-status-pill is-loading" id="plbStatusPill">CONNECTING</span>
        <span class="plb-freshness" id="plbFreshness">Opening live board…</span>
      </div>
    </div>
  </header>

  <div class="plb-sr-only" id="plbAnnouncements" role="status" aria-live="polite" aria-atomic="true"></div>

  <main class="plb-main" id="playerLiveMain">
    <div class="plb-loading-card" id="playerLiveRoot" aria-busy="true">
      <span class="plb-loader" aria-hidden="true"></span>
      <strong>Loading the courts…</strong>
      <span>Connecting to the Paddle Rage live session.</span>
    </div>
  </main>

  <footer class="plb-footer">
    This is a read-only player view. Session changes can only be made by Paddle Rage staff.
  </footer>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js?v=20260725-ready-courts-v1"></script>
  <script src="player-live.js?v=20260725-manager-sync-v2"></script>
</body>
</html>
